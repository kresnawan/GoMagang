[package]
name = "gomagang"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
flate2 = "1.1.10"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
pdf-writer = "0.15"
qrcodegen = "1.8"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rust_xlsxwriter = { version = "0.102.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "derive", "time"] }
time = { version = "0.3.55", features = ["macros", "parsing"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
