[package]
name = "gomagang"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = "0.9.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
