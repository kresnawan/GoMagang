# Compose produksi backend GoMagang di VPS. File ini disalin ke folder deploy di VPS oleh
# scripts/deploy.sh; image-nya tidak di-build di VPS, tetapi dikirim dari laptop.
#
# Nilai ${...} diisi dari file .env di folder deploy, yang ditulis ulang oleh script deploy setiap
# kali deploy. Secret aplikasi tidak ada di sini, tetapi di .env.production yang hanya ada di VPS.
name: gomagang

services:
  backend:
    image: gomagang:${GOMAGANG_TAG:?GOMAGANG_TAG belum di-set}
    container_name: gomagang-backend
    restart: unless-stopped
    # Menjalankan init kecil (tini) sebagai PID 1 yang meneruskan sinyal ke server dan membereskan
    # proses zombie. Server sendiri menangani SIGTERM dan menyelesaikan request yang sedang berjalan.
    init: true
    # Semua konfigurasi dan secret dibaca dari file env di VPS, bukan ditanam di image.
    env_file: .env.production
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      # Volume bernama: Docker menyalin kepemilikan folder dari image (UID 10001) saat volume
      # pertama kali dibuat, jadi tidak perlu chown manual di host.
      - uploads:/data/uploads
    ports:
      # Bawaan hanya terbuka untuk VPS itu sendiri; akses publik lewat reverse proxy atau tunnel.
      - "${GOMAGANG_BIND:-127.0.0.1:3000}:3000"
    networks:
      # default: akses keluar (Google OAuth, SMTP). db: network milik container PostgreSQL.
      - default
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  db:
    # Network ini milik container PostgreSQL yang sudah ada; compose tidak membuat atau menghapusnya.
    external: true
    name: ${PG_NETWORK:?PG_NETWORK belum di-set}

volumes:
  uploads:
    # Nama tetap, supaya berkas unggahan tidak ikut hilang bila nama project compose berubah.
    name: gomagang_uploads
